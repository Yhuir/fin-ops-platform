[package]
name = "fin-ops-api"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
async-trait = "0.1"
async-nats = "0.48"
aws-config = "1"
aws-sdk-s3 = "1"
aws-types = "1"
axum = { version = "0.8", features = ["json", "macros"] }
futures-util = "0.3"
http = "1"
prometheus = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "limit", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_json = "1"
